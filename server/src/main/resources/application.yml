server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework
  address: 0.0.0.0
  compression.enabled: true
  compression.mime-types: application/json,application/x-ndjson
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-stacktrace: always
    include-binding-errors: always
    include-exception: true


logging:
  level:
    org.atmosphere: warn


sync:
  flush-interval-ms: 60000
  flush-threshold: 100
  bulk:
    all-or-nothing: false
    max-batch-size: 200

hwapi:
  pricing:
    active-listings:
      # Shared hourly cycle: eBay Browse API + Kleinanzeigen through Camoufox.
      cron: ${HWAPI_ACTIVE_LISTINGS_CRON:0 20 * * * *}
      # Protect the eBay Browse API quota; raise deliberately when quota allows it.
      max-ebay-specs: ${HWAPI_ACTIVE_LISTINGS_MAX_EBAY_SPECS:250}
  scraping:
    # Set HWAPI_SCRAPING_ENABLED=false on a production server that receives
    # catalog/price imports from a separate local collector.
    enabled: ${HWAPI_SCRAPING_ENABLED:true}
    # selenium = legacy RemoteWebDriver, webscraper = the new Webscraper API
    backend: ${HWAPI_SCRAPER_BACKEND:selenium}
    webscraper:
      base-url: ${WEBSCRAPER_API_URL:http://localhost:8090}
      api-key: ${WEBSCRAPER_API_KEY:dev-key-change-me}
      engine: ${WEBSCRAPER_ENGINE:auto}
      timeout: ${WEBSCRAPER_TIMEOUT:120s}
  opendb:
    enabled: ${HWAPI_OPENDB_ENABLED:true}
    repository: ${HWAPI_OPENDB_REPOSITORY:https://github.com/buildcores/buildcores-open-db.git}
    branch: ${HWAPI_OPENDB_BRANCH:main}
    checkout-directory: ${HWAPI_OPENDB_CHECKOUT_DIR:buildcores-open-db-main}
    schema-directory: ${HWAPI_OPENDB_SCHEMA_DIR:schemas}

spring.jpa.properties.hibernate.default_batch_fetch_size: 64

spring.jpa.properties.hibernate.jdbc.batch_size: 50
spring.jpa.properties.hibernate.order_inserts: true
spring.jpa.properties.hibernate.order_updates: true



logging.level.root: INFO
logging.level.com.ebay.api.feed: INFO
logging.level.org.asynchttpclient: WARN

logging.level.com.ebay.feed.api: DEBUG


ebay:
  feed:
    # OAuth Client Credentials für eBay
    client-id: ${EBAY_CLIENT_ID}
    client-secret: ${EBAY_CLIENT_SECRET}

    # Globale Kategorie für ITEM-Feed (z. B. 58058 = PC-Komponenten)
    # Kann später je Marketplace überschrieben werden
    category-id: ${EBAY_FEED_CATEGORY_ID:58058}

    # Hauptverzeichnis für Feeddownloads
    download-directory: ${EBAY_FEED_DOWNLOAD_DIR:/tmp/ebay-feeds}

    # Welche Marktplätze wollen wir aktiv nutzen?
    # Diese Namen müssen exakt mit deinem Enum übereinstimmen
    enabled-marketplaces:
      - ${EBAY_FEED_MARKETPLACE_1:GERMANY}
      - ${EBAY_FEED_MARKETPLACE_2:AUSTRIA}
      - ${EBAY_FEED_MARKETPLACE_3:SWITZERLAND}
      - ${EBAY_FEED_MARKETPLACE_4:USA}
      - ${EBAY_FEED_MARKETPLACE_5:UK}

icecat:
  enabled: ${ICECAT_ENABLED:false}
  base-url: ${ICECAT_BASE_URL:https://live.icecat.biz/api}
  language: ${ICECAT_LANGUAGE:DE}
  shop-name: ${ICECAT_SHOP_NAME:}
  api-token: ${ICECAT_API_TOKEN:}
  content-token: ${ICECAT_CONTENT_TOKEN:}
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
